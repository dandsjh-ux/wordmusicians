# Render Blueprint: https://render.com/docs/blueprint-spec
# In Render: New + > Blueprint > pick this GitHub repo.
services:
  - type: web
    name: word-musicians
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
